<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/output.css">
    <title>Login Page</title>
</head>

<body class="bg-gray-100 w-full min-h-screen overflow-y-auto">
    <main>
        <section class="h-screen grid grid-cols-5 grid-rows-5 gap-4">
            <div class="bg-blue-950 col-span-2 row-span-5">1</div>
            <div class="bg-gray-100 col-span-3 row-span-5 col-start-3 flex w-full justify-center items-center flex-col">
                <div>
                    <div class="mb-2">
                        <h1 class="text-3xl font-bold">Welcome back</h1>
                        <h3 class="text-gray-500">Sign in to your administrator account</h3>
                    </div>
                    <div>
                        <form action="">
                            <div>
                                <label for="username">Username</label>
                                <input type="text" name="username" id="username" placeholder="Enter your username">
                            </div>
                            <div>
                                <label for="password">Password</label>
                                <input type="password" name="password" id="password" placeholder="Enter your password">
                            </div>
                            <button type="submit">Sign in</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
